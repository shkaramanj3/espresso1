<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#22130c">
<title>Espresso Lounge · Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;700&family=Noto+Naskh+Arabic:wght@400;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#2f1d15; --band:#22130c; --band-text:#f3eadc; --line:rgba(232,199,143,.28); --text:#f3eadc; --muted:#cdb597; --accent:#e8c78f; --sand:#d8b98a;
  --font-latin:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-head:"Fraunces",Georgia,serif;
  --font-ar:"Noto Naskh Arabic","Segoe UI",Tahoma,"Geeza Pro",serif;
}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:70px;background:#2f1d15}
body{background:var(--bg);color:var(--text);font-family:var(--font-latin);line-height:1.6;text-align:center;
  padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
html[dir=rtl] body{font-family:var(--font-ar);line-height:1.9}
.wrap{max-width:640px;margin:0 auto;padding:0 18px}

header{background:var(--band);color:var(--band-text);padding:calc(36px + env(safe-area-inset-top)) 0 26px}
.logo{width:84px;height:84px;border-radius:50%;margin:0 auto 14px;display:grid;place-items:center;
  border:1.5px solid var(--sand);font:700 34px var(--font-head);color:var(--sand);overflow:hidden}
.logo img{width:100%;height:100%;object-fit:cover}
h1{font:700 30px/1.2 var(--font-head);letter-spacing:.01em}
html[dir=rtl] h1{font-family:var(--font-ar)}

.social{display:flex;justify-content:center;flex-wrap:wrap;gap:18px;margin-top:10px;font-size:14px}
.social a{color:var(--sand);text-decoration:none}
.social a:hover{text-decoration:underline}
.langs{display:flex;justify-content:center;gap:8px;margin-top:16px}
.langs button{background:none;border:1px solid rgba(243,234,220,.35);color:var(--band-text);padding:6px 16px;border-radius:99px;
  font:500 14px var(--font-latin);cursor:pointer}
.langs button[aria-pressed=true]{background:var(--band-text);border-color:var(--band-text);color:var(--band);font-weight:600}
header :focus-visible{outline:2px solid var(--sand);outline-offset:2px}
.tabs a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.tabs{position:sticky;top:0;z-index:5;background:#2f1d15;
  border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs .wrap{display:flex;justify-content:center;gap:6px;width:max-content;min-width:100%;max-width:none;margin:0;padding-top:10px;padding-bottom:10px}
.tabs a{display:inline-flex;align-items:center;gap:6px;color:var(--accent);text-decoration:none;padding:6px 14px;border-radius:99px;font-size:14px;border:1px solid var(--line)}
.tabs a:hover{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.tabs .ico{width:16px;height:16px;color:currentColor}
.tabs a[aria-current=true]{background:var(--sand);color:var(--band);border-color:var(--sand);font-weight:600}

section{padding-top:34px}
main.wrap{--text:#3a2418;--muted:#7d6450;--accent:#7a4a2b;--line:#d3bf9f;
  background:#f3e8d6;color:var(--text);border-radius:16px;margin:24px auto 0;width:calc(100% - 28px);max-width:604px;
  padding:0 24px 30px;box-shadow:0 10px 30px rgba(0,0,0,.28)}
main.wrap h2{border-bottom-color:#c9ad82}
main section:last-of-type{min-height:calc(100vh - 200px);min-height:calc(100svh - 200px)}
h2{display:flex;align-items:center;justify-content:center;gap:10px;font:700 24px var(--font-head);color:var(--accent);
  padding-bottom:10px;border-bottom:2px solid var(--sand);margin-bottom:4px}
html[dir=rtl] h2{font-family:var(--font-ar)}
.ico{width:22px;height:22px;flex:none;color:var(--accent)}
.item{display:flex;align-items:baseline;gap:10px;padding:11px 0}
.item .name{font-weight:500;font-size:16px;text-align:start}
.item .desc{display:block;color:var(--muted);font-size:13px;line-height:1.5;font-weight:400}
.item .dots{flex:1;min-width:12px;border-bottom:1px dotted var(--line);transform:translateY(-4px)}
.item .price{font-weight:600;color:var(--accent);white-space:nowrap;font-variant-numeric:tabular-nums}
.item .price small{color:var(--muted);font-weight:400;font-size:11px;margin-inline-start:3px}

footer{background:var(--band);color:var(--sand);font-size:13px;padding:34px 0 calc(34px + env(safe-area-inset-bottom));margin-top:30px}
footer p+p{margin-top:4px}

:root{--bg-logo:url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='320'%20height='230'%20viewBox='0%200%20320%20230'%3E%3Cdefs%3E%3Cg%20id='m'%3E%3Cg%20transform='translate(-23%20-38)%20scale(1.9)'%20fill='none'%20stroke='%23b98a58'%20stroke-width='1.3'%20stroke-linecap='round'%20stroke-linejoin='round'%3E%3Cpath%20d='M4%2010h13v4a5%205%200%200%201-5%205H9a5%205%200%200%201-5-5z'/%3E%3Cpath%20d='M17%2011h1.5a2.5%202.5%200%200%201%200%205H17'/%3E%3Cpath%20d='M8%203c-1%201.2%201%202%200%203.5M12%203c-1%201.2%201%202%200%203.5'/%3E%3C/g%3E%3Ctext%20x='0'%20y='38'%20text-anchor='middle'%20font-family='Georgia,serif'%20font-size='20'%20font-style='italic'%20fill='%23b98a58'%3EEspresso%20Lounge%3C/text%3E%3C/g%3E%3C/defs%3E%3Cuse%20href='%23m'%20x='85'%20y='70'/%3E%3Cuse%20href='%23m'%20x='240'%20y='185'/%3E%3C/svg%3E");--bg-size:320px 230px;--tw:320px;--th:230px}
.bgfx{background:linear-gradient(#2f1d15,#3a251b);position:fixed;inset:0;overflow:hidden;z-index:-1;pointer-events:none;contain:strict}
.logofx{position:fixed;inset:0;overflow:hidden;z-index:3;pointer-events:none;contain:strict}
.logofx::before{content:"";position:absolute;top:calc(var(--th) * -1);left:calc(var(--tw) * -1);
  width:calc(100% + var(--tw));height:calc(100% + var(--th));background-image:var(--bg-logo);background-size:var(--bg-size);
  opacity:.17;animation:drift 30s linear infinite;will-change:transform}
@keyframes drift{to{transform:translate(var(--tw),var(--th))}}
@media (prefers-reduced-motion:reduce){.logofx::before{animation:none}}
</style>
</head>
<body id="top">
<div class="bgfx" aria-hidden="true"></div>
<div class="logofx" aria-hidden="true"></div>

  <div class="logo" id="logo">C</div>

  <nav class="social" id="social" aria-label="Social links"></nav>

      it("Ristretto","ريستريتو",2500),
      it("Lungo","لونغو",2500),
      it("Espresso Lotus","إسبريسو لوتس",3000),
      it("Double Espresso","دبل إسبريسو",3500),

      it("Cappuccino","كابتشينو",3500),
      it("Nescafe Milk","نسكافيه بالحليب",3500),
      it("Mocha","موكا",5000),
      it("Flat White","فلات وايت",4500),
      it("Cortado","كورتادو",3500),
      it("Hot Chocolate","شوكولاتة ساخنة",3000),
      it("Arabic Coffee","قهوة عربية",2500),
      it("Turkish Coffee","قهوة تركية",2500),
      it("Qazwan","قزوان",2500),
      it("Pistachio","فستق",2500),
      it("Milk","حليب",2000),

    ]},

      it("Ice Espresso","إسبريسو مثلج",2500),
      it("Ice Espresso Orange","إسبريسو مثلج بالبرتقال",4000),
      it("Ice Americano","أمريكانو مثلج",3500),

      it("Frappe","فرابيه",4500),

      mj("Green Apple","تفاح أخضر"),
      mj("Pineapple","أناناس"),
      mj("Watermelon","بطيخ"),
      mj("Kiwi","كيوي"),
      mj("Cherry","كرز"),

    ]},
    { id: "smoothies", title: { en: "Smoothies", ar: "سموذي" }, items: [
      it("Special Espresso Lounge","سبيشل إسبريسو لاونج",5500),
      it("Strawberry","فراولة",5000),
      it("Banana","موز",5000),

    ]},
    { id: "milkshakes", title: { en: "Milkshakes", ar: "ميلك شيك" }, items: [
      ms("Chocolate","شوكولاتة"),

    ]},
    { id: "juice", title: { en: "Fresh juice", ar: "عصير طازج" }, items: [
      fj("Orange","برتقال"),

      fj("Strawberry","فراولة"),

    ]},
    { id: "desserts", title: { en: "Desserts", ar: "حلويات" }, items: [
      it("Croissant Roll","رول كرواسون",3000),
      it("Croissant","كرواسون",3000),
      it("Choco Dream","شوكو دريم",3500),
      it("Chocolate Cake","كيكة الشوكولاتة",3000),
      it("Oreo Cake","كيكة أوريو",3000),
      it("Pistachio Cake","كيكة الفستق",3000),
      it("Tres Leches Cake","كيكة تريس ليتشيس",3500),
      it("Tiramisu","تيراميسو",3500),
      it("Lotus Dessert","حلى لوتس",4000),
      it("Oreo Dessert","حلى أوريو",4000),

    ]},
    { id: "pizza", title: { en: "Pizza", ar: "بيتزا" }, items: [
      it("Pizza","بيتزا",3500),

      it("Stromboli","سترومبولي",3000)
    ]}
  ]
};
/* ===================== END OF EDIT AREA ===================== */

const LANGS = { en: { dir: "ltr", html: "en" }, ar: { dir: "rtl", html: "ar" } };
const ICONS = {
  hot: '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10h13v4a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5z"/><path d="M17 11h1.5a2.5 2.5 0 0 1 0 5H17"/><path d="M8 3c-1 1.2 1 2 0 3.5M12 3c-1 1.2 1 2 0 3.5"/></svg>',
  cold: '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8h12l-1.4 11a2 2 0 0 1-2 1.7H9.4a2 2 0 0 1-2-1.7z"/><path d="M13 8l2-5h3"/><path d="M8 12h8"/></svg>',
  mocktails: '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16l-8 9z"/><path d="M12 13v7M8 20h8"/></svg>',
  smoothies: '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 7h10l-1 13H8z"/><path d="M12 7l1.5-4H17"/><path d="M8.5 12c1.5-1 2.5 1 4 0s2.5 1 3 0"/></svg>',
  milkshakes: '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 10h10l-1.2 10H8.2z"/><path d="M6.5 10a5.5 4 0 0 1 11 0"/><path d="M12 3v3"/></svg>',
  juice: '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4v16M4 12h16M6.3 6.3l11.4 11.4M17.7 6.3L6.3 17.7"/></svg>',
  desserts: '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 18v-6h16v6z"/><path d="M3 20h18"/><path d="M4 12c2-1 3 1 5 0s3 1 5 0 4 1 6 0"/><path d="M12 12V8"/></svg>',
  pizza: '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21L4 6a14 14 0 0 1 16 0z"/><circle cx="11" cy="10" r="1"/><circle cx="14" cy="13" r="1"/></svg>'
};
const $ = id => document.getElementById(id);

function fmt(n, lang) {
  const loc = lang === "en" ? "en-US" : "ar-IQ";
  try { return new Intl.NumberFormat(loc).format(n); } catch (e) { return String(n); }
}

function render(lang) {
  const L = LANGS[lang] ? lang : "en";
  document.documentElement.lang = LANGS[L].html;
  document.documentElement.dir = LANGS[L].dir;

  $("cafeName").textContent = CONFIG.name[L];
  document.title = CONFIG.name[L] + " · Menu";
  $("currencyNote").textContent = CONFIG.ui.currency[L];
  $("credit").textContent = CONFIG.ui.credit[L];
  $("thanks").textContent = CONFIG.ui.thanks[L] + " ✦";

  if (CONFIG.logo) {
    const r = document.documentElement.style;
    r.setProperty("--bg-logo", 'url("' + CONFIG.logo + '")');
    r.setProperty("--bg-size", "200px 200px"); r.setProperty("--tw", "200px"); r.setProperty("--th", "200px");
  }
  const logo = $("logo");
  logo.textContent = "";
  if (CONFIG.logo) { const i = document.createElement("img"); i.src = CONFIG.logo; i.alt = ""; logo.appendChild(i); }
  else logo.textContent = CONFIG.logoLetter;

  document.querySelectorAll(".langs button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === L));

  const soc = $("social"); soc.textContent = "";
  Object.entries(CONFIG.social).forEach(([k, url]) => {
    if (!url) return;
    const a = document.createElement("a");
    a.href = url; a.target = "_blank"; a.rel = "noopener";
    a.textContent = k === "map" ? CONFIG.ui.social.map[L] : CONFIG.ui.social[k];
    soc.appendChild(a);
  });

  const tabs = $("tabs").firstElementChild; tabs.textContent = "";
  const menu = $("menu"); menu.textContent = "";
  CONFIG.categories.forEach(c => {
    const t = document.createElement("a");
    t.href = "#" + c.id; t.insertAdjacentHTML("beforeend", ICONS[c.id]); t.append(c.title[L]);
    t.addEventListener("click", e => { e.preventDefault(); goTo(c.id); });
    tabs.appendChild(t);

    const s = document.createElement("section"); s.id = c.id;
    const h = document.createElement("h2"); h.insertAdjacentHTML("beforeend", ICONS[c.id]); h.append(c.title[L]); s.appendChild(h);
    c.items.forEach(it => {
      const row = document.createElement("div"); row.className = "item";
      const nm = document.createElement("div"); nm.className = "name"; nm.textContent = it.name[L];
      if (it.desc) { const d = document.createElement("span"); d.className = "desc"; d.textContent = it.desc[L]; nm.appendChild(d); }
      const dots = document.createElement("span"); dots.className = "dots";
      const pr = document.createElement("div"); pr.className = "price";
      pr.textContent = fmt(it.price, L);
      const u = document.createElement("small"); u.textContent = CONFIG.ui.iqd[L]; pr.appendChild(u);
      row.append(nm, dots, pr); s.appendChild(row);
    });
    menu.appendChild(s);
  });
  try { localStorage.setItem("menu-lang", L); } catch (e) {}
  activeId = null; markActive();
}

function tabsH() { return $("tabs").offsetHeight; }
function goTo(id) {
  const h = document.querySelector("#" + id + " h2");
  if (!h) return;
  const y = h.getBoundingClientRect().top + window.scrollY - tabsH() - 14;
  const calm = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  window.scrollTo({ top: y, behavior: calm ? "auto" : "smooth" });
}
let activeId = null;
function markActive() {
  let cur = null;
  document.querySelectorAll("main section").forEach(sec => {
    if (sec.querySelector("h2").getBoundingClientRect().top <= tabsH() + 40) cur = sec.id;
  });
  if (cur === activeId) return;
  activeId = cur;
  document.querySelectorAll("#tabs a").forEach(a => {
    const on = a.getAttribute("href") === "#" + cur;
    if (on) { a.setAttribute("aria-current", "true"); const bar = $("tabs"), r = a.getBoundingClientRect(), b = bar.getBoundingClientRect();
      bar.scrollBy({ left: (r.left + r.width / 2) - (b.left + b.width / 2) }); }
    else a.removeAttribute("aria-current");
  });
}
let ticking = false;
window.addEventListener("scroll", () => {
  if (ticking) return;
  ticking = true;
  requestAnimationFrame(() => { ticking = false; markActive(); });
}, { passive: true });

document.querySelectorAll(".langs button").forEach(b => b.addEventListener("click", () => render(b.dataset.lang)));
let start = "en";
try { start = localStorage.getItem("menu-lang") || "en"; } catch (e) {}
render(start);
</script>
</body>
</html>
